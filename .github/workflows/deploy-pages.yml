# Build final_project/scaleviz and publish it to GitHub Pages.
#
# The build output is NOT in git (see .gitignore); this rebuilds it from
# source on every push that touches the app. vite.config.js sets base: './',
# so the site works under the project path this serves it at:
#   https://emmaruyiyang.github.io/sci6492-quantitative-aesthetics/
#
# Pages must be set to deploy from GitHub Actions (Settings -> Pages ->
# Source: GitHub Actions), otherwise the deploy step fails with a 404.

name: Deploy scaleviz to Pages

on:
  push:
    branches: [main]
    paths:
      - 'final_project/scaleviz/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: final_project/scaleviz/package-lock.json

      - name: Install
        working-directory: final_project/scaleviz
        run: npm ci

      - name: Build
        working-directory: final_project/scaleviz
        run: npm run build

      - uses: actions/configure-pages@v5

      # path is relative to the workspace root, not to the step above
      - uses: actions/upload-pages-artifact@v3
        with:
          path: final_project/scaleviz/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
