<!doctype html>
<html><head><meta charset="utf-8"><title>orbit render</title>
<style>body{margin:0;background:#222;font:12px monospace;color:#ddd}
canvas{display:block;margin:0 auto}#hud{padding:6px}</style></head>
<body>
<div id="hud">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 800, H = 1000;
const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(2); renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);

scene.add(new THREE.HemisphereLight(0xe8eef5, 0x5a564f, 0.20));
const key = new THREE.DirectionalLight(0xfff4e4, 0.78); key.position.set(1.2, -0.8, 1.5); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8f2, 0.20); fill.position.set(-1.4, 1.0, 0.3); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 0.40); rim.position.set(0.1, 1.5, -1.0); scene.add(rim);

const matSculpt = new THREE.MeshStandardMaterial({color:0x9d968b, roughness:0.95, metalness:0.0});
const screenMats = {
  white:  new THREE.MeshStandardMaterial({color:0xf4f3f1, roughness:0.62, metalness:0.0, side:THREE.DoubleSide}),
  trans:  new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.35, metalness:0.0, side:THREE.DoubleSide,
                                          transparent:true, opacity:0.50}),
  frost:  new THREE.MeshStandardMaterial({color:0xf6f8fa, roughness:0.90, metalness:0.0, side:THREE.DoubleSide,
                                          transparent:true, opacity:0.68}),
};

const CENTER = new THREE.Vector3(28.143, 22.384, 58.039);
let camP = new THREE.PerspectiveCamera(22, W/H, 1, 3000);
const frameH = 132, aspect = W/H;
let camO = new THREE.OrthographicCamera(-frameH*aspect/2, frameH*aspect/2, frameH/2, -frameH/2, 1, 2000);
let cam = camO, camMode = 'ortho', sMode = 'trans';
let screenMesh = null;

function load(name, Type, stride){
  return fetch(name).then(r=>r.arrayBuffer()).then(b=>new Type(b));
}
function build(layer, mat){
  return Promise.all([load(layer+'_pos.bin', Float32Array), load(layer+'_nrm.bin', Float32Array), load(layer+'_idx.bin', Uint32Array)])
    .then(([p,n,i])=>{
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(p,3));
      g.setAttribute('normal', new THREE.BufferAttribute(n,3));
      g.setIndex(new THREE.BufferAttribute(i,1));
      const m = new THREE.Mesh(g, mat); scene.add(m); return m;
    });
}

window.ready = false;
Promise.all([build('sculpture', matSculpt), build('screen', screenMats[sMode])]).then(ms=>{
  screenMesh = ms[1];
  window.ready = true; hud.textContent = 'ready';
  setAz(70);
});

function setAz(deg){
  const el = 10 * Math.PI/180, a = deg * Math.PI/180;
  const r = (camMode === 'ortho') ? 185 : 340;
  const x = CENTER.x + r*Math.cos(a)*Math.cos(el);
  const y = CENTER.y + r*Math.sin(a)*Math.cos(el);
  const z = CENTER.z + r*Math.sin(el);
  cam.position.set(x,y,z); cam.up.set(0,0,1); cam.lookAt(CENTER);
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
}
window.setAz = setAz;
window.setScreen = function(mode){ sMode = mode; if(screenMesh) screenMesh.material = screenMats[mode]; renderer.render(scene,cam); return mode; };
window.setScreenVisible = function(v){ if(screenMesh) screenMesh.visible = v; renderer.render(scene,cam); return v; };
window.setBg = function(hex){ scene.background = new THREE.Color(hex); renderer.render(scene,cam); return hex; };
window.setCam = function(mode){ camMode = mode; cam = (mode==='ortho') ? camO : camP; return mode; };
window.shot = function(name){
  const d = renderer.domElement.toDataURL('image/png');
  return fetch('/save?name='+encodeURIComponent(name), {method:'POST', body:d}).then(r=>r.text());
};
window.orbit = async function(n, prefix){
  for(let i=0;i<n;i++){ setAz(i*360/n); await window.shot(prefix+String(i).padStart(3,'0')+'.png'); }
  hud.textContent = 'orbit done '+prefix; return 'done';
};
</script></body></html>
