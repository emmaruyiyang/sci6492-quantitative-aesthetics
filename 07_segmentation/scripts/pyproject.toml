[project]
name = "qa2026"
version = "0.1.0"
description = "Quantitative Aesthetics 2026"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.1.3",
    "gensim>=4.4.0",
    "scikit-learn>=1.9.1",
    "matplotlib",
    "rhino3dm>=8.35.0",
    "torch",
    "torchvision",
    "torchaudio",
    "open-clip-torch>=3.3.0",
    "opencv-python>=5.0.0.93",
    "tqdm>=4.70.1",
    "umap-learn",
    "librosa>=1.0.0",
    "sounddevice>=0.5.6",
    "pillow>=12.3.0",
    "transformers>=5.20.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
